# Canonical pre-commit config — source of truth for the roots-co fleet.
#   Source: home-hub/tooling/hygiene/pre-commit-config.yaml
#   Rolled out per-repo (as .pre-commit-config.yaml) by bootstrap.sh.
#
# Strict tier, scoped by content:
#   • HYGIENE + SECRETS  → every file (LF, whitespace, large-file, key/secret scan)
#   • FORMAT + LINT GATE → code only (Python, shell, JS/TS)
#   • MARKDOWN / PROSE   → hygiene only, NEVER reflowed
#
# After editing this file: `pre-commit autoupdate` to re-pin `rev:`s, then
# re-run bootstrap.sh across the fleet.

# Paths never worth touching (vendored, generated, binary, big).
exclude: |
  (?x)^(
    .*/node_modules/.*|
    .*/\.venv/.*|
    .*/venv/.*|
    .*/\.pw-browsers/.*|
    .*/\.agent-browser/.*|
    .*/\.browser-profiles/.*|
    .*/browsers/.*|
    .*/cron/output/.*|
    .*\.min\.(js|css)|
    .*\.lock
  )$

repos:
  # ── Universal hygiene (all files) ─────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]   # keep MD hard-break double-spaces
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]                       # the fix for THIS class of outage
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-json
      - id: check-yaml
        # templates/status.yaml is a Go text/template ({{.Status}} etc.), not
        # parseable YAML — it renders at `adb task create` (TASK-00031).
        exclude: ^templates/status\.yaml$
        args: [--allow-multiple-documents]
      - id: detect-private-key

  # ── Secrets (would have caught .env.aws) ──────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # ── Python: format + lint gate (skip vendored upstream patches) ───────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff                               # lint gate (auto-fixes what it can)
        args: [--fix]
        exclude: ^hermes-patches/              # minimal patches to upstream Hermes
      - id: ruff-format
        exclude: ^hermes-patches/

  # ── Shell: format + lint gate ─────────────────────────────────────────────
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [-w, -i, "2", -ci, -sr]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # Gate on real problems only: warning+ severity, and don't demand that
        # every sourced file (.env, sibling libs) be resolvable (SC1091 is info
        # noise on ~every script). Tighten later if you want a stricter bar.
        args: [--severity=warning, --exclude=SC1091]

  # ── JS/TS: format (only actual source files) ──────────────────────────────
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.4
    hooks:
      - id: prettier
        files: \.(m?js|cjs|jsx|tsx?)$

  # ── Go: format + lint gate ────────────────────────────────────────────────
  #
  # ADDED for adb (TASK-00039 Batch 4). The tiers above have no Go section, which
  # is exactly why this repo accumulated 985 golangci-lint findings unnoticed:
  # nothing ran on a .go file at commit time.
  #
  # Deleting this block is therefore not a config tidy-up — it removes the only
  # thing that lints Go before a commit, and the test suite would otherwise stay
  # green while it happened. `test/hygiene/precommit_test.go` asserts all three
  # of the properties below and fails loudly if any goes missing, so remove them
  # together and deliberately or not at all.
  #
  # `repo: local` on purpose, rather than the upstream golangci-lint hook:
  #   - it uses the SAME binary the Makefile requires, so the hook and `make lint`
  #     can never disagree about a version (the upstream hook builds its own,
  #     which is how a hook starts passing what CI fails);
  #   - `pass_filenames: false` runs the whole module. A per-file run cannot see
  #     cross-package findings — `unused` in particular is answered by whether any
  #     OTHER package references a symbol, so file-scoped runs would have missed
  #     11 of the 12 dead functions this batch deleted;
  #   - `types: [go]` keeps it off commits that touch no Go.
  # Measured on this tree: 7.8s cold, 3.7s warm, for the full ./... run.
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint (format + vet + lint, whole module)
        entry: golangci-lint run ./...
        language: system
        types: [go]
        pass_filenames: false
